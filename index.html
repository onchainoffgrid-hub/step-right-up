<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Step Right Up — Critters on Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c140c;
      --paper: #f6efe2;
      --gold: #c4a35a;
      --gold-2: #e3c77a;
      --gold-deep: #8d6b2f;
      --pine: #2c4a38;
      --pine-2: #121c16;
      --card: #fffaf1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Source Sans 3", system-ui, sans-serif;
      background: radial-gradient(1000px 560px at 50% -12%, #3d5c47, var(--pine-2) 52%, #0a100c 100%);
      color: var(--paper);
      padding: 10px;
      min-height: 100vh;
    }
    .phone {
      max-width: 430px;
      margin: 0 auto;
      background: linear-gradient(180deg, #1c2d24 0%, #0e1510 100%);
      border: 1px solid rgba(196,163,90,.4);
      border-radius: 28px;
      min-height: 92vh;
      position: relative;
      overflow: hidden;
    }
    .watermark {
      position: absolute; right: 12px; bottom: 8px; z-index: 6;
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      color: rgba(196,163,90,.4); pointer-events: none;
    }
    header.top {
      padding: 14px 16px 4px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-family: Fraunces, Georgia, serif; color: var(--gold); font-size: 15px; cursor: pointer; }
    .stats { font-size: 12px; color: #d7c9a8; }
    main { padding: 4px 16px 32px; }
    h1,h2,h3 { font-family: Fraunces, Georgia, serif; }
    h1 { font-size: 30px; line-height: 1.08; margin: 2px 0 8px; }
    h2 { font-size: 23px; margin-bottom: 8px; }
    .lead { color: #eadfc8; font-size: 15px; line-height: 1.45; margin-bottom: 14px; }
    .hint { font-size: 12px; color: #cbb994; margin-bottom: 10px; letter-spacing: .04em; }
    .mark {
      width: 100%; height: 168px; object-fit: cover; object-position: center 35%;
      border-radius: 18px; margin: 6px 0 12px; border: 1px solid rgba(196,163,90,.28);
    }
    .mark.small { height: 120px; object-position: center 42%; }
    .btn, .card-btn, .choice {
      width: 100%; border: 1px solid rgba(196,163,90,.3);
      background: rgba(255,250,241,.07); color: var(--paper);
      border-radius: 16px; padding: 13px 14px; font: inherit; text-align: left; cursor: pointer;
    }
    .btn.primary {
      background: linear-gradient(180deg, var(--gold), var(--gold-deep));
      color: var(--ink); font-weight: 700; text-align: center; border: 0; margin-top: 8px;
    }
    .btn.ghost { text-align: center; margin-top: 8px; }
    .grid { display: grid; gap: 9px; }
    .game-card { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
    .game-card img { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; }
    .game-card b { display: block; font-size: 16px; margin-bottom: 3px; }
    .game-card span { font-size: 13px; color: #d7c9a8; }
    .lesson {
      background: var(--card); color: var(--ink); border-radius: 20px; padding: 16px; margin: 8px 0 12px;
    }
    .lesson .tag {
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--gold-deep); font-weight: 700; margin-bottom: 6px;
    }
    .lesson p { font-size: 15px; line-height: 1.45; margin-top: 6px; }
    .lesson ul { margin: 8px 0 0 18px; font-size: 14px; line-height: 1.45; }
    .lesson a { color: var(--gold-deep); font-weight: 700; }
    .check a { color: var(--gold-2); }
    .meter { height: 8px; background: #2a382f; border-radius: 99px; overflow: hidden; margin: 8px 0 12px; }
    .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #f3e0a6); }
    .choice { background: #fff; color: var(--ink); }
    .choice.good { outline: 2px solid #3d6b4f; }
    .choice.bad { outline: 2px solid #8a4a32; }
    .badge {
      background: radial-gradient(circle at 30% 0%, #fff7df, #e7c9b0);
      color: var(--ink); border-radius: 22px; padding: 16px; text-align: center; margin: 10px 0;
    }
    .badge canvas { width: 230px; height: 230px; }
    .check { background: rgba(255,250,241,.08); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
    .check li { margin: 6px 0 6px 16px; }
    .tiny { font-size: 11px; color: #b9a888; margin-top: 14px; line-height: 1.4; }
    #watch { width: 100%; height: 440px; background: #0f1812; border-radius: 16px; display: block; touch-action: manipulation; }
    .hud { display: flex; justify-content: space-between; font-size: 13px; color: var(--gold-2); margin: 8px 0; }
    .toast { min-height: 44px; font-size: 14px; color: #f6efe2; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="top">
      <div class="brand" onclick="go('home')">Step Right Up</div>
      <div class="stats">Wings <b id="wings">0</b></div>
    </header>
    <main id="app"></main>
    <div class="watermark">Critters on Call</div>
  </div>
<script>
const OFFICIAL = "https://www.stepupforstudents.org/";
const APPLY = "https://www.stepupforstudents.org/scholarships/private-school/apply/";
const PEP = "https://www.stepupforstudents.org/handbook-web/pep-family-handbook/";
const DATES = "https://www.stepupforstudents.org/faq/faqs-for-2026-27-scholarship-deadlines-and-payment-schedules/";
const MARK1 = "step-right-up-mark.jpg";
const MARK2 = "the-watch-mark.jpg";

const state = {
  screen: "home",
  role: "mom",
  lesson: 0,
  q: 0,
  score: 0,
  locked: false,
  why: "",
  wings: Number(localStorage.getItem("sru-wings") || 0),
  watch: null
};

const ROLES = {
  mom: { title: "Mom", badge: "Filed It", line: "You know enough to open the portal." },
  dad: { title: "Dad", badge: "Filed It", line: "You sat down and learned the door." },
  grandma: { title: "Grandma", badge: "Filed It", line: "You turned a form into options." },
  auntie: { title: "Auntie", badge: "Filed It", line: "You did the grown-up tab." },
  friends: { title: "Two friends", badge: "Filed It", line: "You two actually opened the laptop." },
  writein: { title: "That’s me", badge: "Filed It", line: "You wrote yourself in. That counts." }
};

const LESSONS = [
  {
    tag: "1 of 7 · What it is",
    title: "Step Up is the booth. Not the school.",
    body: "Step Up For Students is a Florida nonprofit that runs the scholarship portal (EMA), checks documents, and moves the money. You apply there. Not in a Facebook group. Not at a farm.",
    bullets: ["They administer Florida’s choice scholarships.", "2025–26: they funded 520,000+ students.", "Use the real site. Ignore look-alikes."],
    href: OFFICIAL, hrefLabel: "stepupforstudents.org — live"
  },
  {
    tag: "2 of 7 · Pick a door",
    title: "Homeschool year? That door is PEP.",
    body: "One child, one scholarship path. Applying to two programs for the same kid at the same time is how files stall.",
    bullets: [
      "Home / custom / not full-time in a school → FTC-PEP.",
      "Private school full-time → FTC / FES-EO.",
      "Documented unique ability or IEP → FES-UA (as early as age 3)."
    ],
    href: PEP, hrefLabel: "PEP handbook — live"
  },
  {
    tag: "3 of 7 · Who gets in line",
    title: "Florida kid. That is the gate.",
    body: "PEP and the private-school scholarships need a Florida resident (or an active-duty military dependent with PCS orders to Florida) who can enroll in K–12. Kindergarten: five on or before September 1.",
    bullets: [
      "Income is priority, not a locked door. Lower income goes first.",
      "Funding is not promised. Deadlines and capacity decide.",
      "Full-time public-school funding and this scholarship do not stack."
    ]
  },
  {
    tag: "4 of 7 · You are not early",
    title: "Jacksonville already does this.",
    body: "The weird feeling is the only thing you have to crush. The line is already long.",
    bullets: [
      "Private-school scholarships, 2025–26: about 286,000 students.",
      "PEP accounts: about 79,000 funded statewide.",
      "Duval County: about 3,700 PEP students.",
      "Feb 2026 season open: 200,000 applications in three days."
    ]
  },
  {
    tag: "5 of 7 · The five moves",
    title: "This is the whole dance.",
    body: "Learn it here. Do it once on the real site.",
    bullets: [
      "Create the parent account and open EMA.",
      "Add the student. One application per program.",
      "Upload two different Florida residency proofs. Age proof for K/1. Military LES + PCS if that is you.",
      "Submit, then kill blurry uploads when they nag.",
      "Accept the award. Unaccepted money leaves."
    ],
    href: APPLY, hrefLabel: "Apply in EMA — live"
  },
  {
    tag: "6 of 7 · The date trap",
    title: "PEP closes April 30.",
    body: "Private-school new apps can run to November 15. New PEP apps do not. Homeschool families miss this every year and think they have fall.",
    bullets: [
      "2026–27 renewals: Feb 1–April 30.",
      "2026–27 new PEP: Feb 1–April 30.",
      "2026–27 new private school / UA: Feb 1–Nov 15.",
      "New private-school awards: accept by Dec 15.",
      "Active-duty military can get deadline exceptions. Still upload the papers."
    ],
    href: DATES, hrefLabel: "2026–27 dates — live"
  },
  {
    tag: "7 of 7 · What the money is",
    title: "PEP buys the year. Not a vibe.",
    body: "PEP is an education savings account for students not enrolled full-time in public or private school. Awards run roughly $7,700–$8,500 by grade and county.",
    bullets: [
      "Curriculum, materials, testing, tutoring, part-time classes, approved programs.",
      "You file a Student Learning Plan. Renewals need last year’s scores in the portal.",
      "A farm day only counts if that provider is approved for that expense. Check EMA. Do not assume."
    ]
  }
];

const QUIZ = [
  {
    q: "Step Up For Students is…",
    opts: [
      { t: "A private school in Jacksonville", ok: false, why: "They do not teach anyone. They run the money and the portal." },
      { t: "The nonprofit that runs Florida’s scholarship portal", ok: true, why: "EMA lives on their site. That is the booth." },
      { t: "A homeschool co-op", ok: false, why: "Co-ops are local. Step Up is statewide plumbing." }
    ]
  },
  {
    q: "Custom / home year, not full-time in a school. Which door?",
    opts: [
      { t: "FTC-PEP", ok: true, why: "PEP is the home-style account." },
      { t: "Only FES-EO", ok: false, why: "FES-EO is the private-school door." },
      { t: "Hope Scholarship forever", ok: false, why: "Hope is a different, older path. Do not default to it." }
    ]
  },
  {
    q: "Do you have to be low-income to apply?",
    opts: [
      { t: "Yes. No exceptions.", ok: false, why: "That used to be closer to true. It is not the rule now." },
      { t: "No. Income changes priority, not the right to apply.", ok: true, why: "Lower income goes first. Everyone can get in line." },
      { t: "Only in Duval", ok: false, why: "County does not invent a different poverty rule." }
    ]
  },
  {
    q: "About how many PEP students were funded statewide in 2025–26?",
    opts: [
      { t: "A few hundred", ok: false, why: "That would still be a pilot. This is not a pilot." },
      { t: "Nearly 80,000", ok: true, why: "You are joining a crowd, not starting a club." },
      { t: "Two million", ok: false, why: "That would be almost every Florida kid. It is not." }
    ]
  },
  {
    q: "Duval PEP families that year were about…",
    opts: [
      { t: "37", ok: false, why: "Too small. This is already a Jacksonville habit." },
      { t: "3,700", ok: true, why: "Thousands of local families already filed." },
      { t: "370,000", ok: false, why: "That would be the whole metro twice." }
    ]
  },
  {
    q: "New PEP applications for 2026–27 close…",
    opts: [
      { t: "November 15", ok: false, why: "That is the private-school / UA new-app date. PEP is earlier." },
      { t: "April 30", ok: true, why: "This is the date homeschool families miss." },
      { t: "Whenever the co-op posts it", ok: false, why: "The state does not wait on a Facebook admin." }
    ]
  },
  {
    q: "After you are awarded, the last move is…",
    opts: [
      { t: "Screenshot it and wait", ok: false, why: "Unaccepted awards leave." },
      { t: "Accept the scholarship in EMA by the deadline", ok: true, why: "Accept is the click that turns paper into money." },
      { t: "Have the farm apply for you", ok: false, why: "Parents own the EMA account. Providers cannot file it." }
    ]
  }
];

const ROCKS = [
  { label: "Car payment", praise: "The car still exists. That is not nothing.", color: "#e07a3d", ink: "#1c140c" },
  { label: "Rent", praise: "Roof stayed over their heads.", color: "#c4a35a", ink: "#1c140c" },
  { label: "Mortgage", praise: "You made the ugly payment.", color: "#8d6b2f", ink: "#f6efe2" },
  { label: "Recital", praise: "Somebody got to the auditorium on time.", color: "#d46a9a", ink: "#1c140c" },
  { label: "Soccer", praise: "Cleats, water, the right field.", color: "#3d8b5a", ink: "#f6efe2" },
  { label: "Homeschool", praise: "The year is still a year because you ran it.", color: "#2c6e8b", ink: "#f6efe2" },
  { label: "Step Up", praise: "You opened the portal. Most people talk about it.", color: "#c4a35a", ink: "#1c140c" },
  { label: "Groceries", praise: "There is food in the house tonight.", color: "#6aa84f", ink: "#1c140c" },
  { label: "Doctor", praise: "The form got hunted down.", color: "#4a90a4", ink: "#f6efe2" },
  { label: "Co-op text", praise: "You sent the pin. The thread lived.", color: "#7b5ea7", ink: "#f6efe2" },
  { label: "Portfolio", praise: "Proof, saved.", color: "#d4a017", ink: "#1c140c" },
  { label: "Dinner", praise: "They ate. Civilization held.", color: "#d97746", ink: "#1c140c" },
  { label: "Carpool", praise: "Small humans crossed a county.", color: "#2a9d8f", ink: "#f6efe2" },
  { label: "Snack", praise: "Fourteenth snack. Still standing.", color: "#e9c46a", ink: "#1c140c" },
  { label: "Bedtime", praise: "You closed the day.", color: "#3d4a8b", ink: "#f6efe2" },
  { label: "Birthday", praise: "Someone will remember the cake.", color: "#e76f9a", ink: "#1c140c" },
  { label: "Oil change", praise: "The minivan did not get a vote.", color: "#6d6a63", ink: "#f6efe2" },
  { label: "Laundry", praise: "A clean shirt appeared. Magic.", color: "#5b8def", ink: "#f6efe2" },
  { label: "Field trip", praise: "Dirt instead of another worksheet.", color: "#4f7d4a", ink: "#f6efe2" },
  { label: "IEP call", praise: "You stayed on the line.", color: "#b56576", ink: "#f6efe2" }
];

const $ = (id) => document.getElementById(id);
const app = () => $("app");
function save() {
  localStorage.setItem("sru-wings", state.wings);
  const el = $("wings");
  if (el) el.textContent = state.wings;
}
function go(name) { state.screen = name; render(); }

function home() {
  return `
    <p class="hint">Critters on Call · Florida</p>
    <h1>Step Right Up.</h1>
    <p class="lead">Two little games. First you learn the scholarship well enough to file. Then you clear the list that is already on your phone.</p>
    <div class="grid">
      <button class="card-btn game-card" onclick="startStep()">
        <img src="${MARK1}" alt="" />
        <div>
          <b>Step Right Up</b>
          <span>Seven lessons. Seven questions. Earn the gate-and-wings image.</span>
        </div>
      </button>
      <button class="card-btn game-card" onclick="go('watch')">
        <img src="${MARK2}" alt="" />
        <div>
          <b>Your Week</b>
          <span>Juggling mom energy. Colored balls. Recital, soccer, the mortgage.</span>
        </div>
      </button>
    </div>
    <p class="tiny">A confidence tool, not the application and not legal advice. Rules and money live at Step Up. We just make the first door less scary.</p>
  `;
}

function startStep() {
  state.lesson = 0; state.q = 0; state.score = 0; state.locked = false; state.why = "";
  go("role");
}

function role() {
  const presets = ["mom", "dad", "grandma", "auntie", "friends"];
  return `
    <img class="mark small" src="${MARK1}" alt="" />
    <p class="hint">Who is playing</p>
    <h2>Who is filing</h2>
    <p class="lead">Mom first. Or say who you actually are.</p>
    <div class="grid">
      ${presets.map((id) => `
        <button class="card-btn" onclick="pickRole('${id}')"><b>${ROLES[id].title}</b></button>
      `).join("")}
    </div>
    <div class="lesson" style="margin-top:10px">
      <div class="tag">Write it in</div>
      <p>Nana. Coach. Two friends. The person who actually does the portal.</p>
      <input id="writein" maxlength="24" placeholder="That’s me"
        style="width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #c4a35a;font:inherit" />
      <p class="why" id="writeWarn" style="display:none">Try another name.</p>
    </div>
    <button class="btn primary" onclick="saveWriteIn()">Use that</button>
    <button class="btn ghost" onclick="go('home')">Both games</button>
  `;
}
function pickRole(id) { state.role = id; go("lesson"); }
function blockedName(s) {
  const t = (s || "").toLowerCase();
  const bad = ["fuck","shit","bitch","asshole","cunt","nigger","nigga","faggot","retard","rape","porn","pussy","dick","cock","slut","whore"];
  return bad.some((w) => t.includes(w));
}
function saveWriteIn() {
  const el = document.getElementById("writein");
  const raw = (el && el.value || "").trim().replace(/[^a-zA-Z0-9 '\-]/g, "");
  const warn = document.getElementById("writeWarn");
  if (!raw || blockedName(raw)) {
    if (warn) warn.style.display = "block";
    return;
  }
  ROLES.writein.title = raw.slice(0, 24);
  ROLES.writein.line = "Hold it, " + ROLES.writein.title + ".";
  state.role = "writein";
  go("lesson");
}

function lesson() {
  const L = LESSONS[state.lesson];
  const pct = Math.round((state.lesson / LESSONS.length) * 100);
  return `
    <p class="hint">${ROLES[state.role].title} · Step Right Up</p>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <div class="lesson">
      <div class="tag">${L.tag}</div>
      <h3>${L.title}</h3>
      <p>${L.body}</p>
      <ul>${L.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
      ${L.href ? `<p style="margin-top:10px"><a href="${L.href}" target="_blank" rel="noopener">${L.hrefLabel}</a></p>` : ""}
    </div>
    <button class="btn primary" onclick="nextLesson()">${state.lesson === LESSONS.length - 1 ? "Quiz me" : "Got it"}</button>
    <button class="btn ghost" onclick="go('home')">Both games</button>
  `;
}
function nextLesson() {
  if (state.lesson < LESSONS.length - 1) { state.lesson++; go("lesson"); }
  else go("quiz");
}

function quiz() {
  const Q = QUIZ[state.q];
  const pct = Math.round((state.q / QUIZ.length) * 100);
  return `
    <p class="hint">Question ${state.q + 1} / ${QUIZ.length} · ${state.score} right</p>
    <div class="meter"><i style="width:${pct}%"></i></div>
    <div class="lesson">
      <h3>${Q.q}</h3>
      ${state.why ? `<p class="why">${state.why}</p>` : ""}
    </div>
    <div class="grid">
      ${Q.opts.map((o, i) => `<button class="choice" onclick="answer(${i})">${o.t}</button>`).join("")}
    </div>
  `;
}

function answer(i) {
  if (state.locked) return;
  state.locked = true;
  const Q = QUIZ[state.q];
  const buttons = [...document.querySelectorAll(".choice")];
  buttons.forEach((b, idx) => {
    if (Q.opts[idx].ok) b.classList.add("good");
    if (idx === i && !Q.opts[idx].ok) b.classList.add("bad");
  });
  state.why = Q.opts[i].why;
  const box = document.querySelector(".lesson");
  if (box && !box.querySelector(".why")) {
    const p = document.createElement("p");
    p.className = "why";
    p.textContent = state.why;
    box.appendChild(p);
  }
  if (Q.opts[i].ok) state.score++;
  setTimeout(() => {
    state.locked = false;
    state.why = "";
    state.q++;
    if (state.q >= QUIZ.length) go("wings");
    else go("quiz");
  }, 850);
}

function paintBadge() {
  const c = document.getElementById("badge");
  if (!c) return;
  const ctx = c.getContext("2d");
  const w = c.width, h = c.height;
  ctx.fillStyle = "#1b3026";
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "#c4a35a";
  ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(w/2, h/2, 122, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = "#e3c77a";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(w/2, h/2, 108, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = "#c4a35a";
  ctx.font = "700 18px Fraunces, Georgia, serif";
  ctx.textAlign = "center";
  ctx.fillText("STEP RIGHT UP", w/2, 92);
  ctx.fillStyle = "#f6efe2";
  ctx.font = "700 36px Fraunces, Georgia, serif";
  ctx.fillText(ROLES[state.role].badge, w/2, 138);
  ctx.fillStyle = "#e3c77a";
  ctx.font = "16px Source Sans 3, sans-serif";
  ctx.fillText(state.score + " / " + QUIZ.length + " · " + ROLES[state.role].title, w/2, 168);
  ctx.fillStyle = "#c4a35a";
  ctx.font = "12px Source Sans 3, sans-serif";
  ctx.fillText("CRITTERS ON CALL", w/2, 202);
}

function wings() {
  const passed = state.score >= 5;
  if (passed) { state.wings += 1; save(); }
  setTimeout(paintBadge, 20);
  return `
    <div class="badge">
      <canvas id="badge" width="280" height="280"></canvas>
      <h2>${passed ? ROLES[state.role].line : "Close. Run it once more."}</h2>
      <p>${passed
        ? "That image is the wings. It means you can file without guessing."
        : "You had " + state.score + " right. Five opens the gate."}</p>
    </div>
    <div class="check">
      <b>Real level — do this on the official site</b>
      <ol>
        <li><a href="${OFFICIAL}" target="_blank" rel="noopener">Open stepupforstudents.org</a></li>
        <li><a href="${APPLY}" target="_blank" rel="noopener">Apply / create the EMA account</a></li>
        <li>Add the child</li>
        <li>Two residency docs, two different types</li>
        <li>If PEP: April 30 — <a href="${DATES}" target="_blank" rel="noopener">dates</a></li>
        <li>Accept if awarded</li>
      </ol>
    </div>
    <a class="btn primary" style="display:block;text-decoration:none" href="${APPLY}" target="_blank" rel="noopener">Apply on Step Up — live</a>
    <button class="btn ghost" onclick="go('watch')">Juggle the week</button>
    <button class="btn ghost" onclick="startStep()">Replay</button>
    <p class="tiny">2025–26 counts from Step Up fact sheets. Trust the portal when numbers move.</p>
  `;
}

function watchScreen() {
  setTimeout(bootWatch, 30);
  return `
    <img class="mark small" src="${MARK2}" alt="" />
    <p class="hint">Module 2 · Your Week</p>
    <h2>Juggling it.</h2>
    <p class="lead">Recital. Soccer. The mortgage. Tap the ball before it drops.</p>
    <div class="hud"><span>Held <b id="held">0</b></span><span>Dropped <b id="dropped">0</b>/5</span></div>
    <canvas id="watch" width="400" height="440"></canvas>
    <div class="toast" id="toast">Tap what falls.</div>
    <button class="btn ghost" onclick="stopWatch(); go('home')">Both games</button>
  `;
}

function stopWatch() {
  if (state.watch && state.watch.raf) cancelAnimationFrame(state.watch.raf);
  state.watch = null;
}

function bootWatch() {
  const canvas = document.getElementById("watch");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const rocks = [];
  let held = 0, dropped = 0, over = false, acc = 0, last = performance.now();
  state.watch = { raf: 0 };

  function spawn() {
    const item = ROCKS[Math.floor(Math.random() * ROCKS.length)];
    rocks.push({
      x: 40 + Math.random() * (canvas.width - 80),
      y: -28,
      v: 1.05 + Math.random() * 1.55,
      r: 34 + Math.random() * 8,
      wobble: Math.random() * Math.PI * 2,
      ...item
    });
  }

  function hitAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);
    if (over) { stopWatch(); bootWatch(); return; }
    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      const wx = r.x + Math.sin(r.wobble || 0) * 7;
      const dx = x - wx, dy = y - r.y;
      if (dx * dx + dy * dy <= r.r * r.r) {
        rocks.splice(i, 1);
        held++;
        state.wings += 1; save();
        const h = document.getElementById("held");
        const toast = document.getElementById("toast");
        if (h) h.textContent = held;
        if (toast) toast.textContent = r.praise;
        break;
      }
    }
  }

  function tick(t) {
    const dt = Math.min(40, t - last); last = t; acc += dt;
    if (!over && acc > 780) { acc = 0; spawn(); }
    ctx.fillStyle = "#1a2e24";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(227,199,122,.35)";
    ctx.strokeRect(8, 8, canvas.width - 16, canvas.height - 16);
    ctx.fillStyle = "rgba(196,163,90,.45)";
    ctx.font = "10px Source Sans 3, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("CRITTERS ON CALL", 16, canvas.height - 14);

    for (let i = rocks.length - 1; i >= 0; i--) {
      const rock = rocks[i];
      rock.wobble += dt / 220;
      rock.y += rock.v * (dt / 16);
      const x = rock.x + Math.sin(rock.wobble) * 7;
      const grd = ctx.createRadialGradient(x - rock.r * 0.35, rock.y - rock.r * 0.4, 4, x, rock.y, rock.r);
      grd.addColorStop(0, "#fff6d8");
      grd.addColorStop(0.28, rock.color);
      grd.addColorStop(1, rock.color);
      ctx.beginPath();
      ctx.arc(x, rock.y, rock.r, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(28,20,12,.28)";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x - rock.r * 0.32, rock.y - rock.r * 0.38, rock.r * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.fill();
      ctx.fillStyle = rock.ink;
      ctx.font = "700 11px Source Sans 3, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(rock.label, x, rock.y + 4);
      if (rock.y - rock.r > canvas.height) {
        rocks.splice(i, 1);
        dropped++;
        const d = document.getElementById("dropped");
        if (d) d.textContent = dropped;
        if (dropped >= 5) over = true;
      }
    }

    if (over) {
      ctx.fillStyle = "rgba(16,24,18,.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#e3c77a";
      ctx.textAlign = "center";
      ctx.font = "700 28px Fraunces, Georgia, serif";
      ctx.fillText("Week paused", canvas.width / 2, 190);
      ctx.fillStyle = "#f6efe2";
      ctx.font = "16px Source Sans 3, sans-serif";
      ctx.fillText(held + " cleared. Tap to take the week again.", canvas.width / 2, 224);
      return;
    }
    state.watch.raf = requestAnimationFrame(tick);
  }

  canvas.onpointerdown = (e) => { e.preventDefault(); hitAt(e.clientX, e.clientY); };
  spawn();
  state.watch.raf = requestAnimationFrame(tick);
}

function render() {
  save();
  const map = { home, role, lesson, quiz, wings, watch: watchScreen };
  stopWatch();
  app().innerHTML = map[state.screen]();
}
save();
render();
</script>
</body>
